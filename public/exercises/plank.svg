<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e293b; }
      .text { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 16px; text-anchor: middle; }
      .title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .box { fill: #334155; rx: 12; ry: 12; }
      .highlight { fill: #818cf8; }
      .arrow { stroke: #475569; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Title -->
  <text x="400" y="50" class="title">Plank</text>
  
  <!-- Frames -->
  <!-- Start Position -->
  <rect x="50" y="100" width="200" height="200" class="box" />
  <text x="150" y="140" class="text highlight" font-weight="bold">START</text>
  <circle cx="150" cy="200" r="20" fill="#cbd5e1" />
  <rect x="145" y="220" width="10" height="40" fill="#cbd5e1" />
  <text x="150" y="280" class="text" font-size="12">Initial position</text>

  <!-- Arrow -->
  <path d="M 270 200 L 310 200 M 300 190 L 310 200 L 300 210" class="arrow" />

  <!-- Movement -->
  <rect x="330" y="100" width="200" height="200" class="box" />
  <text x="430" y="140" class="text highlight" font-weight="bold">MOVEMENT</text>
  <circle cx="430" cy="210" r="20" fill="#cbd5e1" />
  <rect x="425" y="230" width="10" height="30" fill="#cbd5e1" />
  <text x="430" y="280" class="text" font-size="12">Action phase</text>

  <!-- Arrow -->
  <path d="M 550 200 L 590 200 M 580 190 L 590 200 L 580 210" class="arrow" />

  <!-- End Position -->
  <rect x="610" y="100" width="140" height="200" class="box" />
  <text x="680" y="140" class="text highlight" font-weight="bold">END</text>
  <circle cx="680" cy="200" r="20" fill="#cbd5e1" />
  <rect x="675" y="220" width="10" height="40" fill="#cbd5e1" />
  <text x="680" y="280" class="text" font-size="12">Return to start</text>
</svg>